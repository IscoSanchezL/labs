<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio de circuitos · Labs</title>
<meta name="description" content="Arma circuitos con pila, resistencias, LED e interruptores. Misiones hasta construir un semáforo. Grado 6°.">
<link rel="icon" type="image/png" href="../../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/lab.css">
<style>
.zona{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start;padding-bottom:30px}
.lienzo{padding:10px;position:relative}
.lienzo canvas{display:block;width:100%;height:auto;border-radius:16px;touch-action:none;background:#0a1626;cursor:default}
.paleta{display:flex;flex-wrap:wrap;gap:8px;margin:10px 4px 2px;align-items:center}
.paleta .sep{width:1px;align-self:stretch;background:var(--edge);margin:0 4px}
.comp{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:14px;border:1px solid var(--edge);background:var(--glass);font-size:14px}
.comp:hover{border-color:rgba(127,240,228,.6)}
.comp[aria-pressed="true"]{border-color:rgba(127,240,228,.9);box-shadow:0 0 18px -4px rgba(79,209,197,.8);background:rgba(127,240,228,.12)}
.comp[disabled]{opacity:.4;cursor:not-allowed}
.pt{width:12px;height:12px;border-radius:50%;display:inline-block}
.pasos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pasos .tab{padding:7px 12px;font-size:13.5px}
.pasos .tab.hecha::after{content:' ✓';color:var(--ok)}
.lista{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px;color:var(--muted)}
.lista li{display:flex;gap:8px;align-items:center}
.lista .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--dim);flex:0 0 auto}
.lista .si .dot{background:var(--ok);border-color:var(--ok)}
.lista .si{color:var(--text)}
.quiz button.op{display:block;width:100%;text-align:left;margin-top:8px;padding:10px 14px;border-radius:14px;border:1px solid var(--edge);background:var(--glass);font-size:14.5px;line-height:1.4}
.quiz button.op:hover{border-color:rgba(127,240,228,.6)}
.quiz button.op.bien{border-color:var(--ok);background:rgba(139,232,174,.14)}
.quiz button.op.mal{border-color:var(--bad);background:rgba(255,107,125,.12)}
.semaforo{display:flex;gap:10px;align-items:center;margin-top:12px}
.semaforo .luz{width:26px;height:26px;border-radius:50%;background:#1a2a3d;border:2px solid #0b1a2c;transition:box-shadow .2s,background .2s}
.semaforo .luz.r.on{background:#ff5a6b;box-shadow:0 0 22px 4px rgba(255,90,107,.8)}
.semaforo .luz.a.on{background:#ffd36b;box-shadow:0 0 22px 4px rgba(255,211,107,.8)}
.semaforo .luz.v.on{background:#5ef0a0;box-shadow:0 0 22px 4px rgba(94,240,160,.8)}
.alerta{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:10px 18px;border-radius:999px;background:rgba(40,10,18,.92);border:1px solid var(--bad);font-size:14.5px;display:none;z-index:3;text-align:center;max-width:92%}
.alerta.v{display:block}
.mini{font-size:12.5px;color:var(--dim)}
.aprende dt{font-weight:700;margin-top:8px}
.aprende dd{margin:2px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
kbd{padding:1px 6px;border-radius:6px;border:1px solid var(--edge);font-size:12px}
@media (max-width:980px){.zona{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="piso" aria-hidden="true"></div>

<header class="top"><div class="wrap">
  <div class="logo"><img src="../../logo.png" alt="Isco Sánchez" width="40" height="40"><div>Gi School<span> · Labs</span></div></div>
  <div class="der"><div id="lang"></div><a class="volver" href="../../stem/" data-i18n="c.volver"></a></div>
</div></header>

<main class="wrap">
  <section class="titulo">
    <span class="eyebrow" data-i18n="c.eyebrow"></span>
    <h1 data-i18n="c.h1"></h1>
    <p class="sub" data-i18n="c.sub"></p>
  </section>

  <section class="zona">
    <div>
      <div class="glass lienzo">
        <div class="alerta" id="alerta" role="alert"></div>
        <canvas id="cv" width="1600" height="1000" data-i18n-attr="aria-label:c.tablero"></canvas>
        <div class="paleta" id="paleta" role="group" data-i18n-attr="aria-label:c.piezas"></div>
        <div class="paleta">
          <button class="tab" id="tMover" type="button" aria-pressed="true" data-i18n="c.mover"></button>
          <button class="tab" id="tBorrar" type="button" aria-pressed="false" data-i18n="c.borrar"></button>
          <button class="tab" id="bRotar" type="button" data-i18n="c.rotar"></button>
          <span class="sep"></span>
          <button class="btn sec" id="bLimpiar" type="button" data-i18n="c.vaciar"></button>
          <button class="btn sec" id="bReparar" type="button" data-i18n="c.reparar"></button>
        </div>
        <p class="mini" style="margin:8px 6px 4px" data-i18n="c.ayuda"></p>
      </div>
    </div>

    <aside>
      <div class="glass panel">
        <h2 data-i18n="c.mision"></h2>
        <div class="pasos" id="pasos"></div>
        <div class="msg" id="texto"></div>
        <ul class="lista" id="check"></ul>
        <div class="fila" style="margin-top:12px">
          <button class="btn sec" id="bPista" type="button" data-i18n="c.pista"></button>
          <button class="btn sec" id="bSol" type="button" data-i18n="c.solucion"></button>
        </div>
        <div class="msg" id="pista" style="display:none;margin-top:10px"></div>
      </div>

      <div class="glass panel quiz" id="quiz" style="display:none">
        <h2 data-i18n="c.pregunta"></h2>
        <div id="qTxt" style="font-size:15px;line-height:1.45"></div>
        <div id="qOps"></div>
        <div class="msg" id="qExp" style="display:none;margin-top:10px"></div>
      </div>

      <div class="glass panel" id="autoPanel" style="display:none">
        <h2 data-i18n="c.autoTit"></h2>
        <p class="mini" style="margin:0 0 10px" data-i18n="c.autoTxt"></p>
        <div class="fila"><button class="btn" id="bAuto" type="button"></button></div>
        <div class="semaforo"><span class="luz r" id="lR"></span><span class="luz a" id="lA"></span><span class="luz v" id="lV"></span></div>
      </div>

      <div class="glass panel aprende">
        <h2 data-i18n="c.aprende"></h2>
        <dl style="margin:0">
          <dt data-i18n="c.dtLed"></dt><dd data-i18n="c.ddLed"></dd>
          <dt data-i18n="c.dtRes"></dt><dd data-i18n="c.ddRes"></dd>
          <dt data-i18n="c.dtSw"></dt><dd data-i18n="c.ddSw"></dd>
          <dt data-i18n="c.dtSP"></dt><dd data-i18n="c.ddSP"></dd>
          <dt data-i18n="c.dtJP"></dt><dd data-i18n="c.ddJP"></dd>
        </dl>
      </div>

      <div class="glass panel">
        <h2 data-i18n="c.entrega"></h2>
        <label class="et" for="nombre" data-i18n="c.tuNombre"></label>
        <input type="text" id="nombre" maxlength="40" autocomplete="off" data-i18n-attr="placeholder:c.phNombre">
        <div class="fila" style="margin-top:10px"><button class="btn sec" id="bImg" type="button" data-i18n="c.guardarImg"></button></div>
      </div>
    </aside>
  </section>
</main>

<footer><div class="wrap"><div data-i18n="c.pie"></div><div>iscosanchez.com</div></div></footer>

<script src="../../assets/i18n.js"></script>
<script src="motor.js"></script>

(function(){
'use strict';
var M=window.MotorCircuitos;
var T=I18N.t;
var COLS=16,FILAS=10;
var $=function(id){return document.getElementById(id)};
var cv=$('cv'),ctx=cv.getContext('2d');
var S={comps:[],cables:[],herr:'mover',colocar:null,cur:null,arr:null,cable:null,sel:null,sim:null,val:null,mision:0,auto:null,alertaT:0,n:0};
var AV;try{AV=JSON.parse(localStorage.getItem('labs-circuitos')||'{}')}catch(e){AV={}}
AV.hechas=AV.hechas||{};
function guardar(){try{localStorage.setItem('labs-circuitos',JSON.stringify(AV))}catch(e){}}
var COLORES={rojo:'#ff5a6b',amarillo:'#ffd36b',verde:'#5ef0a0'};

/* ---------- geometría de las piezas ---------- */
function termPos(c,t){
  if(c.tipo==='empalme')return {x:c.x,y:c.y};
  var v=c.or===1,s=t==='a'?-1:1;
  return v?{x:c.x,y:c.y+s}:{x:c.x+s,y:c.y};
}
function terminales(c){return M.TERMINALES[c.tipo].map(function(t){var p=termPos(c,t);return {id:c.id+':'+t,x:p.x,y:p.y,comp:c,t:t}})}
function todasTerminales(){var a=[];S.comps.forEach(function(c){a=a.concat(terminales(c))});return a}
function terminalPorId(id){var i=id.split(':'),c=compPorId(i[0]);return c?termPos(c,i[1]):null}
function compPorId(id){return S.comps.filter(function(c){return c.id===id})[0]}
function cuerpo(c){ // rectángulo del símbolo
  if(c.tipo==='empalme')return {x0:c.x-.2,y0:c.y-.2,x1:c.x+.2,y1:c.y+.2};
  return c.or===1?{x0:c.x-.42,y0:c.y-.62,x1:c.x+.42,y1:c.y+.62}:{x0:c.x-.62,y0:c.y-.42,x1:c.x+.62,y1:c.y+.42};
}
function cs(){return cv.width/COLS}
function nuevoId(tipo){S.n++;var p={pila:'P',resistencia:'R',led:'L',interruptor:'S',empalme:'E'}[tipo];var id;do{id=p+S.n;S.n++}while(compPorId(id));return id}
function hayChoque(c,ignorar){
  var mis=terminales(c);
  return S.comps.some(function(o){
    if(o===ignorar||o===c)return false;
    if(o.x===c.x&&o.y===c.y)return true;
    return terminales(o).some(function(t){return mis.some(function(m){return m.x===t.x&&m.y===t.y})});
  });
}
function dentro(c){return terminales(c).every(function(t){return t.x>=0&&t.x<=COLS&&t.y>=1&&t.y<=FILAS-1})}

/* ---------- ruta de los cables ---------- */
function ruta(a,b){
  var hv=[a,{x:b.x,y:a.y},b],vh=[a,{x:a.x,y:b.y},b];
  if(a.x===b.x||a.y===b.y)return [a,b];
  function pena(r){
    var n=0;
    for(var s=0;s<r.length-1;s++){
      var p=r[s],q=r[s+1],L=Math.max(Math.abs(q.x-p.x),Math.abs(q.y-p.y))*8;
      for(var i=1;i<L;i++){
        var x=p.x+(q.x-p.x)*i/L,y=p.y+(q.y-p.y)*i/L;
        S.comps.forEach(function(c){var r2=cuerpo(c);if(c.tipo!=='empalme'&&x>r2.x0&&x<r2.x1&&y>r2.y0&&y<r2.y1)n++});
      }
    }
    return n;
  }
  return pena(vh)<=pena(hv)?vh:hv;
}

/* ---------- simulación y misión ---------- */
function circuito(){
  return {comps:S.comps.map(function(c){return {id:c.id,tipo:c.tipo,valor:c.valor,color:c.color,abierto:!!c.abierto,quemado:!!c.quemado}}),cables:S.cables.map(function(w){return [w[0],w[1]]})};
}
function recalcular(){
  var circ=circuito();
  S.sim=M.simular(circ);
  // los LED que se queman se quedan quemados hasta que el alumno los cambie
  S.sim.quemados.forEach(function(id){var c=compPorId(id);if(c&&!c.quemado){c.quemado=true;avisar(T('c.a.quemo'))}});
  if(S.sim.quemados.length)S.sim=M.simular(circuito());
  if(S.sim.corto)avisar(T('c.a.corto'));
  S.val=M.MISIONES[S.mision].validar(circuito());
  S.comps.forEach(function(c){if(c.tipo==='led'){/* nada */}});
  actualizarMision();
}
function avisar(t){var a=$('alerta');a.textContent=t;a.classList.add('v');clearTimeout(S.alertaT);S.alertaT=setTimeout(function(){a.classList.remove('v')},3600)}

function criterios(){
  var n=S.mision,c=circuito(),sim=S.sim,leds=S.comps.filter(function(x){return x.tipo==='led'});
  var tiene=function(t){return S.comps.some(function(x){return x.tipo===t})};
  var enc=function(l){var r=sim.comps[l.id];return r&&r.lit};
  var L=[];
  L.push([T('c.k.pila'),tiene('pila')]);
  if(n===0){L.push([T('c.k.res'),tiene('resistencia')]);L.push([T('c.k.led'),tiene('led')]);L.push([T('c.k.brilla'),S.val&&S.val.ok]);}
  if(n===1){L.push([T('c.k.sw'),tiene('interruptor')]);L.push([T('c.k.swok'),S.val&&S.val.ok]);}
  if(n===2){L.push([T('c.k.dos'),leds.length>=2]);L.push([T('c.k.juntos'),leds.filter(enc).length>=2]);L.push([T('c.k.serie'),S.val&&S.val.ok]);}
  if(n===3){L.push([T('c.k.dos'),leds.length>=2]);L.push([T('c.k.juntos'),leds.filter(enc).length>=2]);L.push([T('c.k.par'),S.val&&S.val.ok]);}
  if(n===4){['rojo','amarillo','verde'].forEach(function(col){L.push([T('c.k.'+col),leds.some(function(l){return l.color===col})])});
    L.push([T('c.k.tres'),S.comps.filter(function(x){return x.tipo==='interruptor'}).length>=3]);
    L.push([T('c.k.cada'),S.val&&S.val.ok]);}
  return L;
}
function actualizarMision(){
  var m=M.MISIONES[S.mision];
  $('texto').innerHTML=T('c.m'+m.id+'.texto');
  var ul=$('check');ul.textContent='';
  criterios().forEach(function(k){var li=document.createElement('li');if(k[1])li.className='si';li.innerHTML='<span class="dot"></span><span>'+k[0]+'</span>';ul.appendChild(li)});
  document.querySelectorAll('#pasos .tab').forEach(function(b,i){b.textContent=(i+1)+'. '+T('c.m'+(i+1)+'.tab');b.title=T('c.m'+(i+1)+'.nombre');b.setAttribute('aria-pressed',String(i===S.mision));b.classList.toggle('hecha',!!AV.hechas[i+1])});
  var ok=S.val&&S.val.ok;
  $('quiz').style.display=ok?'block':'none';
  if(ok&&!S.quizMostrado!==false){}
  $('autoPanel').style.display=(S.mision===4&&ok)?'block':'none';
  if(ok&&!AV.hechas[S.mision+1]){AV.hechas[S.mision+1]=true;guardar();document.querySelectorAll('#pasos .tab')[S.mision].classList.add('hecha')}
  if(ok&&S.quizDe!==S.mision){armarQuiz()}
  if(!ok){S.quizDe=null}
  // paleta: pila única
  document.querySelectorAll('#paleta .comp').forEach(function(b){if(b.dataset.tipo==='pila')b.disabled=S.comps.some(function(c){return c.tipo==='pila'})});
}
function armarQuiz(){
  var m=M.MISIONES[S.mision];S.quizDe=S.mision;
  $('qTxt').textContent=T('c.m'+m.id+'.pregunta');var box=$('qOps');box.textContent='';$('qExp').style.display='none';
  [0,1,2].forEach(function(i){
    var b=document.createElement('button');b.type='button';b.className='op';b.textContent=T('c.m'+m.id+'.op'+i);
    b.onclick=function(){
      box.querySelectorAll('button').forEach(function(x){x.disabled=true});
      b.classList.add(i===m.correcta?'bien':'mal');
      if(i!==m.correcta)box.querySelectorAll('button')[m.correcta].classList.add('bien');
      var e=$('qExp');e.style.display='block';e.className='msg '+(i===m.correcta?'ok':'mal');
      e.innerHTML=(i===m.correcta?'<b>'+T('c.q.bien')+'</b> ':'<b>'+T('c.q.casi')+'</b> ')+T('c.m'+m.id+'.explica');
    };
    box.appendChild(b);
  });
}

/* ---------- acciones ---------- */
function colocarPieza(tipo,color,x,y){
  var c={id:nuevoId(tipo),tipo:tipo,x:x,y:y,or:0};
  if(tipo==='resistencia')c.valor=220;
  if(tipo==='led'){c.color=color||'rojo'}
  if(tipo==='interruptor')c.abierto=false;
  if(!dentro(c)){c.or=1;if(!dentro(c)){avisar(T('c.a.nocabe'));return null}}
  if(hayChoque(c)){avisar(T('c.a.choque'));return null}
  if(tipo==='pila'&&S.comps.some(function(k){return k.tipo==='pila'})){avisar(T('c.a.unapila'));return null}
  S.comps.push(c);recalcular();return c;
}
function cablear(t1,t2){
  if(t1===t2)return false;
  if(S.cables.some(function(w){return (w[0]===t1&&w[1]===t2)||(w[0]===t2&&w[1]===t1)}))return false;
  S.cables.push([t1,t2]);recalcular();return true;
}
function borrarComp(c){
  S.comps=S.comps.filter(function(x){return x!==c});
  S.cables=S.cables.filter(function(w){return w[0].split(':')[0]!==c.id&&w[1].split(':')[0]!==c.id});
  if(S.sel===c)S.sel=null;recalcular();
}
function vaciar(){S.comps=[];S.cables=[];S.sel=null;detenerAuto();recalcular()}
function rotar(){
  var c=S.sel;if(!c||c.tipo==='empalme')return;
  var old=c.or;c.or=old===1?0:1;
  if(!dentro(c)||hayChoque(c)){c.or=old;avisar(T('c.a.girar'));return}
  recalcular();
}

/* ---------- puntero ---------- */
function aGrid(e){
  var r=cv.getBoundingClientRect(),k=cv.width/r.width,c=cs();
  var px=(e.clientX-r.left)*k/c,py=(e.clientY-r.top)*k/c;
  return {px:px,py:py,x:Math.round(px),y:Math.round(py)};
}
function terminalCerca(p,rad){
  var mejor=null,md=rad||0.42;
  todasTerminales().forEach(function(t){var d=Math.hypot(t.x-p.px,t.y-p.py);if(d<md){md=d;mejor=t}});
  return mejor;
}
function compEn(p){
  for(var i=S.comps.length-1;i>=0;i--){var c=S.comps[i],r=cuerpo(c);
    if(p.px>=r.x0-.08&&p.px<=r.x1+.08&&p.py>=r.y0-.08&&p.py<=r.y1+.08)return c}
  return null;
}
function cableCerca(p){
  var mejor=-1,md=0.28;
  S.cables.forEach(function(w,i){
    var a=terminalPorId(w[0]),b=terminalPorId(w[1]);if(!a||!b)return;
    var r=ruta(a,b);
    for(var s=0;s<r.length-1;s++){
      var P=r[s],Q=r[s+1],dx=Q.x-P.x,dy=Q.y-P.y,L2=dx*dx+dy*dy||1;
      var t=Math.max(0,Math.min(1,((p.px-P.x)*dx+(p.py-P.y)*dy)/L2));
      var d=Math.hypot(p.px-(P.x+t*dx),p.py-(P.y+t*dy));
      if(d<md){md=d;mejor=i}
    }
  });
  return mejor;
}
cv.addEventListener('pointerdown',function(e){
  var p=aGrid(e);S.cur=p;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(S.colocar){var q=S.colocar;S.colocar=null;refrescarPaleta();var c=colocarPieza(q.tipo,q.color,p.x,p.y);if(c)S.sel=c;return}
  if(S.herr==='borrar'){
    var c2=compEn(p);if(c2){borrarComp(c2);return}
    var wi=cableCerca(p);if(wi>=0){S.cables.splice(wi,1);recalcular()}
    return;
  }
  if(S.auto)return;
  var t=terminalCerca(p);
  if(S.cable){ // segundo toque de un cable
    var a=S.cable;S.cable=null;if(t&&t.id!==a.id)cablear(a.id,t.id);return;
  }
  if(t){S.cable={id:t.id,x:t.x,y:t.y,abajo:true};return}
  var c3=compEn(p);
  if(c3){S.sel=c3;S.arr={c:c3,x0:p.px,y0:p.py,ox:c3.x,oy:c3.y,mov:false};return}
  var wi2=cableCerca(p);S.selCable=wi2>=0?wi2:null;S.sel=null;
});
cv.addEventListener('pointermove',function(e){
  var p=aGrid(e);S.cur=p;
  if(S.arr){
    var a=S.arr,dx=Math.round(p.px-a.x0),dy=Math.round(p.py-a.y0);
    if(dx||dy||a.mov){
      var nx=a.ox+dx,ny=a.oy+dy;
      if(nx!==a.c.x||ny!==a.c.y){
        var ox=a.c.x,oy=a.c.y;a.c.x=nx;a.c.y=ny;
        if(!dentro(a.c)||hayChoque(a.c)){a.c.x=ox;a.c.y=oy}else a.mov=true;
      }
    }
  }
});
cv.addEventListener('pointerup',function(e){
  var p=aGrid(e);
  if(S.cable&&S.cable.abajo){
    var t=terminalCerca(p);
    if(t&&t.id!==S.cable.id){cablear(S.cable.id,t.id);S.cable=null}
    else if(t&&t.id===S.cable.id){S.cable.abajo=false}      // un toque: espera el segundo
    else S.cable=null;
  }
  if(S.arr){
    var a=S.arr;S.arr=null;
    if(!a.mov){ // clic sin mover: acción de la pieza
      var c=a.c;
      if(c.tipo==='interruptor'&&!S.auto){c.abierto=!c.abierto;recalcular()}
      else if(c.tipo==='resistencia'){var i=M.RESISTENCIAS.indexOf(c.valor);c.valor=M.RESISTENCIAS[(i+1)%M.RESISTENCIAS.length];recalcular()}
    }else recalcular();
  }
});
cv.addEventListener('pointerleave',function(){S.cur=null});
window.addEventListener('keydown',function(e){
  if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.key==='Escape'){S.cable=null;S.colocar=null;refrescarPaleta()}
  if((e.key==='r'||e.key==='R'))rotar();
  if((e.key==='Delete'||e.key==='Backspace')){
    if(S.sel){borrarComp(S.sel);e.preventDefault()}
    else if(S.selCable!=null&&S.cables[S.selCable]){S.cables.splice(S.selCable,1);S.selCable=null;recalcular()}
  }
});

/* ---------- interfaz ---------- */
function refrescarPaleta(){
  document.querySelectorAll('#paleta .comp').forEach(function(b){
    b.setAttribute('aria-pressed',String(!!S.colocar&&S.colocar.tipo===b.dataset.tipo&&(S.colocar.color||'')===(b.dataset.color||'')));
  });
  $('tMover').setAttribute('aria-pressed',String(S.herr==='mover'));
  $('tBorrar').setAttribute('aria-pressed',String(S.herr==='borrar'));
  cv.style.cursor=S.colocar?'copy':(S.herr==='borrar'?'not-allowed':'default');
}
function armarPaleta(){
  var P=$('paleta');P.textContent='';

function tickAuto(now){
