<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingeniero de estructuras · Labs</title>
<meta name="description" content="Construye puentes y torres con vigas, columnas y travesaños, y pruébalos con carga real. Grado 5°.">
<link rel="icon" type="image/png" href="../../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/lab.css">
<style>
.zona{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start;padding-bottom:30px}
.lienzo{padding:10px}
.lienzo canvas{display:block;width:100%;height:auto;border-radius:16px;touch-action:none;cursor:crosshair;background:#0b1a2c}
.lienzo canvas.borrar{cursor:not-allowed}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:10px 4px 2px}
.nivel{display:flex;align-items:center;gap:10px}
.nivel h3{margin:0;font-size:20px}
.dinero{display:flex;flex-direction:column;gap:6px}
.medidor{height:12px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid var(--edge)}
.medidor i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#4fd1c5,#9db8ff);transition:width .2s}
.medidor.rojo i{background:linear-gradient(90deg,#ffc27a,#ff6b7d)}
.dato{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.dato b{color:var(--text)}
.mat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mat button{padding:10px;border-radius:14px;border:1px solid var(--edge);background:var(--glass);text-align:left;line-height:1.3}
.mat button small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.mat button[aria-pressed="true"]{border-color:rgba(127,240,228,.8);box-shadow:0 0 18px -4px rgba(79,209,197,.7);background:rgba(127,240,228,.12)}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.leyenda{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:13px;color:var(--muted)}
.leyenda .sw{width:22px;height:6px;border-radius:3px;vertical-align:2px}
.aprende dt{font-weight:700;margin-top:8px;color:var(--text)}
.aprende dd{margin:2px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
.mini{font-size:12.5px;color:var(--dim)}
kbd{padding:1px 6px;border-radius:6px;border:1px solid var(--edge);font-size:12px}
.fin{position:relative}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-8px);padding:9px 16px;border-radius:999px;background:rgba(13,27,42,.95);border:1px solid rgba(255,194,122,.8);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:92%;text-align:center;z-index:3}
.toast.v{opacity:1;transform:translate(-50%,0)}
.cabecera{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
@media (max-width:980px){.zona{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="piso" aria-hidden="true"></div>

<header class="top"><div class="wrap">
  <a class="logo" href="../../"><img src="../../logo.png" alt="Isco Sánchez" width="40" height="40"><div>labs<span>.iscosanchez.com</span></div></a>
  <div class="der"><div id="lang"></div><a class="volver" href="../../" data-i18n="e.volver"></a></div>
</div></header>

<main class="wrap">
  <section class="titulo">
    <span class="eyebrow" data-i18n="e.eyebrow"></span>
    <h1 data-i18n="e.h1"></h1>
    <p class="sub" data-i18n="e.sub"></p>
  </section>

  <section class="zona">
    <div>
      <div class="glass lienzo fin">
        <div class="toast" id="toast" role="status"></div>
        <canvas id="cv" width="1400" height="900" data-i18n-attr="aria-label:e.canvas"></canvas>
        <div class="barra">
          <div class="nivel"><h3 id="nTit"></h3><span class="estrellas" id="nEst" aria-hidden="true"></span></div>
          <div class="fila" id="tabsNivel" role="group" data-i18n-attr="aria-label:e.nivel"></div>
        </div>
      </div>
      <div class="glass panel" style="margin-top:14px">
        <h2 data-i18n="e.reto"></h2>
        <div class="msg" id="reto"></div>
      </div>
    </div>

    <aside>
      <div class="glass panel">
        <h2 data-i18n="e.presupuesto"></h2>
        <div class="dinero">
          <div class="dato"><span data-i18n="e.gastado"></span><b id="gasto">$0</b></div>
          <div class="medidor" id="med"><i id="medI"></i></div>
          <div class="dato"><span data-i18n="e.disponible"></span><b id="resta">$0</b></div>
        </div>
      </div>

      <div class="glass panel">
        <h2 data-i18n="e.material"></h2>
        <div class="mat" id="mats"></div>
      </div>

      <div class="glass panel">
        <h2 data-i18n="e.herramientas"></h2>
        <div class="fila" style="margin-bottom:10px">
          <button class="tab" id="tCons" type="button" aria-pressed="true" data-i18n="e.construir"></button>
          <button class="tab" id="tBorr" type="button" aria-pressed="false" data-i18n="e.borrar"></button>
        </div>
        <div class="fila">
          <button class="btn grande" id="bProbar" type="button" data-i18n="e.probar"></button>
          <button class="btn sec" id="bDeshacer" type="button" data-i18n="e.deshacer"></button>
          <button class="btn sec" id="bLimpiar" type="button" data-i18n="e.limpiar"></button>
        </div>
        <p class="mini" style="margin:10px 0 0" data-i18n="e.ayuda"></p>
      </div>

      <div class="glass panel" id="resPanel" style="display:none">
        <h2 data-i18n="e.resultado"></h2>
        <div class="msg" id="resMsg"></div>
        <div class="fila" style="margin-top:10px"><button class="btn" id="bSig" type="button" style="display:none" data-i18n="e.siguiente"></button><button class="btn sec" id="bReint" type="button" data-i18n="e.mejorar"></button></div>
      </div>

      <div class="glass panel">
        <h2 data-i18n="e.piezas"></h2>
        <div class="fila" id="conteo"></div>
        <div class="leyenda" style="margin-top:12px">
          <span><i class="sw" style="background:#4fd1c5"></i><span data-i18n="e.leyEstira"></span></span>
          <span><i class="sw" style="background:#c9a8ff"></i><span data-i18n="e.leyComprime"></span></span>
          <span><i class="sw" style="background:#ff6b7d"></i><span data-i18n="e.leyRompe"></span></span>
        </div>
      </div>

      <div class="glass panel aprende">
        <h2 data-i18n="e.aprende"></h2>
        <dl style="margin:0">
          <dt data-i18n="e.dtViga"></dt><dd data-i18n="e.ddViga"></dd>
          <dt data-i18n="e.dtColumna"></dt><dd data-i18n="e.ddColumna"></dd>
          <dt data-i18n="e.dtTrav"></dt><dd data-i18n="e.ddTrav"></dd>
          <dt data-i18n="e.dtTri"></dt><dd data-i18n="e.ddTri"></dd>
        </dl>
      </div>

      <div class="glass panel">
        <h2 data-i18n="e.entrega"></h2>
        <label class="et" for="nombre" data-i18n="e.tuNombre"></label>
        <input type="text" id="nombre" maxlength="40" autocomplete="off" data-i18n-attr="placeholder:e.phNombre">
        <div class="fila" style="margin-top:10px"><button class="btn sec" id="bImg" type="button" data-i18n="e.guardarImg"></button></div>
        <p class="mini" style="margin:8px 0 0" data-i18n="e.notaImg"></p>
      </div>
    </aside>
  </section>
</main>

<footer><div class="wrap"><div data-i18n="e.pie"></div><div>iscosanchez.com</div></div></footer>

<script src="../../assets/i18n.js"></script>
<script src="motor.js"></script>

I18N.add({"titulo": "Ingeniero de estructuras · Labs", "descripcion": "Construye puentes y torres con vigas, columnas y travesaños, y pruébalos con carga real. Grado 5°.", "e.volver": "← Volver a labs", "e.eyebrow": "// grado 5° · diseño estructural", "e.h1": "Ingeniero de <em>estructuras</em>", "e.sub": "Construye puentes y torres con <b>vigas</b>, <b>columnas</b> y <b>travesaños</b>. Pruébalos con una carga de verdad y descubre por qué los ingenieros aman los triángulos.", "e.canvas": "Zona de construcción: haz clic en un punto y arrastra hasta otro para crear una pieza", "e.nivel": "Nivel", "e.reto": "Reto", "e.presupuesto": "Presupuesto", "e.gastado": "Gastado", "e.disponible": "Disponible", "e.material": "Material", "e.herramientas": "Herramientas", "e.construir": "Construir", "e.borrar": "Borrar pieza", "e.probar": "▶ Probar", "e.deshacer": "Deshacer", "e.limpiar": "Empezar de nuevo", "e.ayuda": "Haz clic en un punto y arrastra hasta otro. También sirve tocar un punto y luego el otro. <kbd>Esc</kbd> cancela.", "e.resultado": "Resultado", "e.siguiente": "Siguiente nivel →", "e.mejorar": "Seguir mejorando", "e.piezas": "Mis piezas", "e.leyEstira": "se estira", "e.leyComprime": "se comprime", "e.leyRompe": "se rompe", "e.aprende": "Aprende", "e.dtViga": "Viga", "e.ddViga": "Pieza horizontal. Sostiene lo que pasa por encima.", "e.dtColumna": "Columna", "e.ddColumna": "Pieza vertical. Aguanta el peso hacia abajo.", "e.dtTrav": "Travesaño", "e.ddTrav": "Pieza inclinada que une las demás. Sin ella, todo se mueve.", "e.dtTri": "¿Por qué triángulos?", "e.ddTri": "Es la única figura que no se deforma al empujarla. Un cuadrado se aplasta; un triángulo no.", "e.entrega": "Entrega", "e.tuNombre": "Tu nombre", "e.phNombre": "Escribe tu nombre", "e.guardarImg": "Guardar imagen de mi diseño", "e.notaImg": "La imagen sale con tu nombre y tus estrellas. Súbela a Classroom.", "e.pie": "Hecho para el aula · Gi School", "e.nivelN": "Nivel {n} · {nombre}", "e.tabNivel": "Nivel {n}" sta menos: quita piezas que no trabajan (las más apagadas) o usa madera donde se pueda.", "e.r.e1": "Funciona. Intenta gastar menos quitando piezas que casi no trabajan.", "e.conf": "¿Empezar de nuevo este nivel?", "e.viento": "viento {f} t", "e.img.tit": "Ingeniero de estructuras · Nivel {n}: {nombre}", "e.img.sin": "Sin nombre", "e.img.costo": "Costo ${c} de ${b}"},{"titulo": "Structural Engineer · Labs", "descripcion": "Build bridges and towers with beams, columns and braces, and test them with a real load. Grade 5.", "e.volver": "← Back to labs", "e.eyebrow": "// grade 5 · structural design", "e.h1": "Structural <em>Engineer</em>", "e.sub": "Build bridges and towers with <b>beams</b>, <b>columns</b> and <b>braces</b>. Test them with a real load and find out why engineers love triangles.", "e.canvas": "Building area: click a point and drag to another to create a piece", "e.nivel": "Level", "e.reto": "Challenge", "e.presupuesto": "Budget", "e.gastado": "Spent", "e.disponible": "Available", "e.material": "Material", "e.herramientas": "Tools", "e.construir": "Build", "e.borrar": "Erase piece", "e.probar": "▶ Test", "e.deshacer": "Undo", "e.limpiar": "Start over", "e.ayuda": "Click a point and drag to another. You can also tap one point, then the other. <kbd>Esc</kbd> cancels.", "e.resultado": "Result", "e.siguiente": "Next level →", "e.mejorar": "Keep improving", "e.piezas": "My pieces", "e.leyEstira": "stretches", "e.leyComprime": "compresses", "e.leyRompe": "breaks", "e.aprende": "Learn", "e.dtViga": "Beam", "e.ddViga": "Horizontal piece. It supports what passes over it.", "e.dtColumna": "Column", "e.ddColumna": "Vertical piece. It carries the weight downward.", "e.dtTrav": "Brace", "e.ddTrav": "Slanted piece that ties the others together. Without it, everything moves.", "e.dtTri": "Why triangles?", "e.ddTri": "It is the only shape that does not deform when pushed. A square collapses; a triangle does not.", "e.entrega": "Hand-in", "e.tuNombre": "Your name", "e.phN (function(){
'use strict';
var M=window.Motor;
var T=I18N.t;
var COLS=14,FILAS=9;
var NIVELES=[
  {id:1,tipo:'puente',presupuesto:260,
   apoyos:[{x:2,y:6,t:'fijo'},{x:8,y:6,t:'rodillo'}],
   cargas:[{x:5,y:6,fy:3,fx:0,etq:'3 t'}]},
  {id:2,tipo:'torre',presupuesto:300,
   apoyos:[{x:6,y:7,t:'fijo'},{x:8,y:7,t:'fijo'}],
   cargas:[{x:7,y:2,fy:1.5,fx:0.8,etq:'1.5 t'}]},
  {id:3,tipo:'puente',presupuesto:420,
   apoyos:[{x:1,y:6,t:'fijo'},{x:11,y:6,t:'rodillo'}],
   cargas:[{x:4,y:6,fy:1.2,fx:0,etq:'1.2 t'},{x:8,y:6,fy:1.2,fx:0,etq:'1.2 t'}]}
];
var MAXL=5;
var $=function(id){return document.getElementById(id)};
var cv=$('cv'),ctx=cv.getContext('2d');
var S={nivel:0,piezas:[],mat:'madera',herr:'construir',inicio:null,abajo:false,cur:null,undo:[],prueba:null,resultado:null,toastT:0,pos:null};
var AV;try{AV=JSON.parse(localStorage.getItem('labs-estructuras')||'{}')}catch(e){AV={}}
AV.estrellas=AV.estrellas||{};
function guardar(){try{localStorage.setItem('labs-estructuras',JSON.stringify(AV))}catch(e){}}
function nv(){return NIVELES[S.nivel]}

/* ---------- geometría ---------- */
function cs(){return cv.width/COLS}
function bloqueado(x,y){
  var n=nv();
  if(x<0||x>COLS||y<1||y>FILAS-1)return true;
  var esApoyo=n.apoyos.some(function(a){return a.x===x&&a.y===y});
  if(esApoyo)return false;
  if(n.tipo==='puente'){
    var izq=Math.min(n.apoyos[0].x,n.apoyos[1].x),der=Math.max(n.apoyos[0].x,n.apoyos[1].x),yb=n.apoyos[0].y;
    if(y>=yb&&(x<=izq||x>=der))return true;     // dentro de las orillas
    if(y>=yb+2)return true;                      // río
    return false;
  }
  if(y>=7)return true;                           // suelo de la torre
  return false;
}
function key(x,y){return x+','+y}
function costoPieza(p){return M.largo({x:p.x1,y:p.y1},{x:p.x2,y:p.y2})*M.MATERIALES[p.mat].precio}
function costoTotal(){return S.piezas.reduce(function(s,p){return s+costoPieza(p)},0)}
function tipoPieza(p){return p.y1===p.y2?'viga':(p.x1===p.x2?'columna':'travesaño')}

function cruza(a,b){ // cruce propio de dos segmentos (sin tocarse en extremos)
  function o(p,q,r){return (q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x)}
  var d1=o(a.p,a.q,b.p),d2=o(a.p,a.q,b.q),d3=o(b.p,b.q,a.p),d4=o(b.p,b.q,a.q);
  return ((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0));
}
function sobreSegmento(p,a,b){ // punto p dentro del segmento a-b (sin extremos)
  var cr=(b.x-a.x)*(p.y-a.y)-(b.y-a.y)*(p.x-a.x);
  if(Math.abs(cr)>1e-9)return false;
  var dot=(p.x-a.x)*(b.x-a.x)+(p.y-a.y)*(b.y-a.y),L2=(b.x-a.x)*(b.x-a.x)+(b.y-a.y)*(b.y-a.y);
  return dot>1e-9&&dot<L2-1e-9;
}
function nodosActuales(){
  var m={};
  nv().apoyos.concat(nv().cargas).forEach(function(n){m[key(n.x,n.y)]={x:n.x,y:n.y}});
  S.piezas.forEach(function(p){m[key(p.x1,p.y1)]={x:p.x1,y:p.y1};m[key(p.x2,p.y2)]={x:p.x2,y:p.y2}});
  return Object.keys(m).map(function(k){return m[k]});
}
function validar(x1,y1,x2,y2,mat){
  if(x1===x2&&y1===y2)return T('e.err.mismo');
  if(bloqueado(x1,y1)||bloqueado(x2,y2))return T('e.err.bloq');
  var L=Math.hypot(x2-x1,y2-y1);
  if(L>MAXL+1e-9)return T('e.err.max',{m:MAXL});
  var dup=S.piezas.some(function(p){return (p.x1===x1&&p.y1===y1&&p.x2===x2&&p.y2===y2)||(p.x1===x2&&p.y1===y2&&p.x2===x1&&p.y2===y1)});
  if(dup)return T('e.err.dup');
  var A={x:x1,y:y1},B={x:x2,y:y2},i;
  var nodos=nodosActuales();
  for(i=0;i<nodos.length;i++){var q=nodos[i];if(sobreSegmento(q,A,B))return T('e.err.nodo')}
  for(i=0;i<S.piezas.length;i++){
    var p=S.piezas[i],P={x:p.x1,y:p.y1},Q={x:p.x2,y:p.y2};
    if(cruza({p:A,q:B},{p:P,q:Q}))return T('e.err.cruce');
    if(sobreSegmento(A,P,Q)||sobreSegmento(B,P,Q))return T('e.err.sobre');
  }
  var costo=costoTotal()+L*M.MATERIALES[mat].precio;
  if(costo>nv().presupuesto+1e-9)return T('e.err.presu');
  return null;
}

/* ---------- estado y acciones ---------- */
function snapshot(){S.undo.push(JSON.stringify(S.piezas));if(S.undo.length>80)S.undo.shift()}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('v');clearTimeout(S.toastT);S.toastT=setTimeout(function(){e.classList.remove('v')},2600)}
function agregar(x1,y1,x2,y2){
  var err=validar(x1,y1,x2,y2,S.mat);
  if(err){toast(err);return false}
  snapshot();S.piezas.push({x1:x1,y1:y1,x2:x2,y2:y2,mat:S.mat});
  limpiarPrueba();actualizarUI();return true;
}
function limpiarPrueba(){S.prueba=null;S.resultado=null;$('resPanel').style.display='none'}
function borrarEn(px,py){
  var c=cs(),mejor=-1,md=0.32;
  S.piezas.forEach(function(p,i){
    var ax=p.x1*c,ay=p.y1*c,bx=p.x2*c,by=p.y2*c,dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;
    var t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/L2));
    var d=Math.hypot(px-(ax+t*dx),py-(ay+t*dy))/c;
    if(d<md){md=d;mejor=i}
  });
  if(mejor>=0){snapshot();S.piezas.splice(mejor,1);limpiarPrueba();actualizarUI()}
}
function nivelEstrellas(costo){
  var B=nv().presupuesto;
  return costo<=B*0.63?3:(costo<=B*0.82?2:1);
}
function construirModelo(){
  var nodos=[],idx={};
  nv().apoyos.forEach(function(a){idx[key(a.x,a.y)]=nodos.length;nodos.push({x:a.x,y:a.y,apoyo:a.t})});
  nv().cargas.forEach(function(c){var k=key(c.x,c.y);if(idx[k]===undefined){idx[k]=nodos.length;nodos.push({x:c.x,y:c.y,fx:c.fx||0,fy:c.fy||0})}});
  S.piezas.forEach(function(p){
    [[p.x1,p.y1],[p.x2,p.y2]].forEach(function(q){var k=key(q[0],q[1]);if(idx[k]===undefined){idx[k]=nodos.length;nodos.push({x:q[0],y:q[1]})}});
  });
  var pz=S.piezas.map(function(p){return {a:idx[key(p.x1,p.y1)],b:idx[key(p.x2,p.y2)],mat:p.mat}});
  return {nodos:nodos,piezas:pz,idx:idx};
}
function probar(){
  if(!S.piezas.length){toast(T('e.err.vacio'));return}
  var mod=construirModelo();
  var res=M.analizar(mod.nodos,mod.piezas);
  var sinConexion=nv().cargas.some(function(c){return !S.piezas.some(function(p){return (p.x1===c.x&&p.y1===c.y)||(p.x2===c.x&&p.y2===c.y)})});
  S.prueba={t0:performance.now(),res:res,mod:mod,sinConexion:sinConexion,final:false};
  S.resultado=null;$('resPanel').style.display='none';
}
function terminarPrueba(){
  var P=S.prueba,r=P.res,costo=costoTotal(),msg,ok=false,estr=0;
  var nPandeo=r.piezas.filter(function(p){return p.pandeo}).length;
  var nRotura=r.piezas.filter(function(p){return p.falla&&!p.pandeo}).length;
  if(P.sinConexion){msg=T('e.r.sinCon')}
  else if(r.mecanismo){msg=T('e.r.mec')}
  else if(r.falla){
    msg=T('e.r.rompio');
    if(nPandeo)msg+=T('e.r.pandeo',{n:nPandeo});
    if(nRotura)msg+=T('e.r.rotura',{n:nRotura});
    msg+=T('e.r.rojas');
  }else{
    ok=true;estr=nivelEstrellas(costo);
    msg=T('e.r.ok',{c:Math.round(costo),b:nv().presupuesto});
    msg+=estr===3?T('e.r.e3'):(estr===2?T('e.r.e2'):T('e.r.e1'));
    var prev=AV.estrellas[nv().id]||0;
    if(estr>prev){AV.estrellas[nv().id]=estr;guardar()}
  }
  S.resultado={ok:ok,estr:estr};
  $('resPanel').style.display='block';
  var rm=$('resMsg');rm.className='msg '+(ok?'ok':'mal');rm.innerHTML=msg+(ok?'<div class="estrellas" style="margin-top:8px">'+estrellasHtml(estr)+'</div>':'');
  $('bSig').style.display=(ok&&S.nivel<NIVELES.length-1)?'inline-block':'none';
  actualizarUI();
}
function estrellasHtml(n){var s='';for(var i=1;i<=3;i++)s+=i<=n?'★':'<span class="off">★</span>';return s}

/* ---------- interfaz ---------- */

function cambiarNivel(i){
  if(i<0||i>=NIVELES.length)return;
  S.nivel=i;S.piezas=[];S.undo=[];S.inicio=null;limpiarPrueba();actualizarUI();
}

/* ---------- puntero ---------- */
function aGrid(e){
  var r=cv.getBoundingClientRect(),k=cv.width/r.width;
  var px=(e.clientX-r.left)*k,py=(e.clientY-r.top)*k,c=cs();
  return {px:px,py:py,x:Math.max(0,Math.min(COLS,Math.round(px/c))),y:Math.max(0,Math.min(FILAS,Math.round(py/c)))};
}
cv.addEventListener('pointerdown',function(e){
  if(S.prueba&&!S.resultado)return;
  var p=aGrid(e);S.cur=p;
  if(S.herr==='borrar'){borrarEn(p.px,p.py);return}
  if(S.prueba)limpiarPrueba();
  if(S.inicio){var a=S.inicio;S.inicio=null;S.abajo=false;agregar(a.x,a.y,p.x,p.y);return}
  if(bloqueado(p.x,p.y)){toast(T('e.err.bloq'));return}
  S.inicio={x:p.x,y:p.y};S.abajo=true;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',function(e){S.cur=aGrid(e)});
cv.addEventListener('pointerup',function(e){
  var p=aGrid(e);
  if(S.abajo&&S.inicio&&(p.x!==S.inicio.x||p.y!==S.inicio.y)){var a=S.inicio;S.inicio=null;agregar(a.x,a.y,p.x,p.y)}
  S.abajo=false;
});
cv.addEventListener('pointerleave',function(){S.cur=null});
window.addEventListener('keydown',function(e){if(e.key==='Escape'){S.inicio=null}});

/* ---------- dibujo (aspecto realista) ---------- */
var COL={tension:'#4fd1c5',compresion:'#c9a8ff',falla:'#ff6b7d'};
function rnd(n){var x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
var fondo=null,fondoKey='';

/* fondo: cielo, montañas, nubes, terreno y rocas (se dibuja una sola vez y se guarda) */
function construirFondo(){
  var W=cv.width,H=cv.height,c=cs(),n=nv(),o=document.createElement('canvas');o.width=W;o.height=H;
  var x=o.getContext('2d'),i,j;
  var g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#10304f');g.addColorStop(.5,'#0d2238');g.addColorStop(1,'#08121f');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  // luna y estrellas
  for(i=0;i<70;i++){x.fillStyle='rgba(200,230,255,'+(0.12+rnd(i)*0.4)+')';x.fillRect(rnd(i*3)*W,rnd(i*5)*H*0.5,1+rnd(i*7)*1.6,1+rnd(i*7)*1.6)}
  var lg=x.createRadialGradient(W*.82,H*.16,0,W*.82,H*.16,c*1.3);lg.addColorStop(0,'rgba(220,240,255,.9)');lg.addColorStop(.12,'rgba(200,225,255,.55)');lg.addColorStop(1,'rgba(200,225,255,0)');
  x.fillStyle=lg;x.beginPath();x.arc(W*.82,H*.16,c*1.3,0,6.283);x.fill();
  x.fillStyle='#e9f3ff';x.beginPath();x.arc(W*.82,H*.16,c*.32,0,6.283);x.fill();
  // nubes suaves
  for(i=0;i<6;i++){var cx=rnd(i*11)*W,cy=H*(.12+rnd(i*13)*.3),rg=x.createRadialGradient(cx,cy,0,cx,cy,c*(1.6+rnd(i)*1.4));rg.addColorStop(0,'rgba(120,170,220,.16)');rg.addColorStop(1,'rgba(120,170,220,0)');x.fillStyle=rg;x.beginPath();x.ellipse(cx,cy,c*(2.4+rnd(i)*1.6),c*.7,0,0,6.283);x.fill()}
  // montañas lejanas (3 capas)
  [['#12304c',.62,.20,1],['#0f2840',.70,.16,2.3],['#0c1f33',.78,.12,3.7]].forEach(function(l){
    x.fillStyle=l[0];x.beginPath();x.moveTo(0,H);
    for(var px=0;px<=W;px+=6){var yy=H*l[1]-(Math.sin(px/W*6.3*l[3]+l[3])*0.5+Math.sin(px/W*17*l[3]+2)*0.25+Math.sin(px/W*41+l[3])*0.08+0.6)*H*l[2]*.8;x.lineTo(px,yy)}
    x.lineTo(W,H);x.closePath();x.fill();
  });
  var bruma=x.createLinearGradient(0,H*.5,0,H*.85);bruma.addColorStop(0,'rgba(60,110,150,0)');bruma.addColorStop(1,'rgba(60,110,150,.22)');x.fillStyle=bruma;x.fillRect(0,H*.5,W,H*.4);

  function roca(x0,x1,yTop){
    // cara de roca con estratos, grietas y pasto
    var alto=H-yTop,gr=x.createLinearGradient(0,yTop,0,H);gr.addColorStop(0,'#4a5a5e');gr.addColorStop(.35,'#36444c');gr.addColorStop(1,'#1b242d');
    x.fillStyle=gr;x.beginPath();x.moveTo(x0,H);x.lineTo(x0,yTop);
    for(var px=x0;px<=x1;px+=c*.25)x.lineTo(px,yTop+(rnd(px*.07)-.5)*c*.10);
    x.lineTo(x1,yTop);x.lineTo(x1,H);x.closePath();x.fill();
    x.save();x.beginPath();x.rect(x0,yTop,x1-x0,alto);x.clip();
    for(var k=0;k<9;k++){var yy=yTop+c*(.45+k*.55)+rnd(k+x0)*c*.2;x.strokeStyle='rgba('+(k%2?'255,255,255':'0,0,0')+','+(0.07+rnd(k)*0.08)+')';x.lineWidth=c*(.04+rnd(k*3)*.07);
      x.beginPath();x.moveTo(x0,yy);for(var qx=x0;qx<=x1;qx+=c*.5)x.lineTo(qx,yy+Math.sin(qx*.02+k)*c*.08+(rnd(qx+k)-.5)*c*.06);x.stroke()}
    for(k=0;k<14;k++){var gx=x0+rnd(k*5+x0)*(x1-x0),gy=yTop+rnd(k*9)*alto*.8;x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=1.4;x.beginPath();x.moveTo(gx,gy);x.lineTo(gx+(rnd(k)-.5)*c*.5,gy+c*(.3+rnd(k*2)*.5));x.lineTo(gx+(rnd(k+4)-.5)*c*.6,gy+c*(.8+rnd(k*3)*.6));x.stroke()}
    for(k=0;k<26;k++){x.fillStyle='rgba(255,255,255,'+(0.03+rnd(k*7)*.05)+')';x.beginPath();x.ellipse(x0+rnd(k*3)*(x1-x0),yTop+c*.3+rnd(k*5)*alto*.75,c*(.15+rnd(k)*.3),c*(.08+rnd(k*2)*.12),0,0,6.283);x.fill()}
    x.restore();
    // tierra y pasto
    var tg=x.createLinearGradient(0,yTop-c*.05,0,yTop+c*.35);tg.addColorStop(0,'#3d7a52');tg.addColorStop(.45,'#2d5c40');tg.addColorStop(1,'rgba(45,92,64,0)');
    x.fillStyle=tg;x.fillRect(x0,yTop-c*.05,x1-x0,c*.4);
    x.strokeStyle='#5fb07a';x.lineWidth=1.4;
    for(var bx=x0;bx<x1;bx+=c*.08){var h=c*(.05+rnd(bx*.3)*.12);x.beginPath();x.moveTo(bx,yTop);x.lineTo(bx+(rnd(bx)-.5)*c*.07,yTop-h);x.stroke()}
  }
  function carretera(x0,x1,yTop){
    var h=c*.16,gr=x.createLinearGradient(0,yTop-h,0,yTop);gr.addColorStop(0,'#3a424f');gr.addColorStop(1,'#232a35');
    x.fillStyle=gr;x.fillRect(x0,yTop-h,x1-x0,h);
    x.fillStyle='rgba(255,255,255,.25)';x.fillRect(x0,yTop-h,x1-x0,2);
    x.fillStyle='#ffd36b';for(var px=x0+c*.2;px<x1-c*.3;px+=c*.7)x.fillRect(px,yTop-h*.55,c*.38,Math.max(2,h*.12));
  }
  if(n.tipo==='puente'){
    var izq=Math.min(n.apoyos[0].x,n.apoyos[1].x)*c,der=Math.max(n.apoyos[0].x,n.apoyos[1].x)*c,yb=n.apoyos[0].y*c;
    roca(-4,izq,yb);roca(der,W+4,yb);
    carretera(0,izq,yb);carretera(der,W,yb);
    // barandas
    x.strokeStyle='rgba(190,210,235,.55)';x.lineWidth=2;
    [[0,izq],[der,W]].forEach(function(r){x.beginPath();x.moveTo(r[0],yb-c*.42);x.lineTo(r[1],yb-c*.42);x.stroke();for(var px=r[0]+c*.2;px<r[1];px+=c*.6){x.beginPath();x.moveTo(px,yb-c*.42);x.lineTo(px,yb-c*.16);x.stroke()}});
  }else{
    roca(-4,W+4,7*c);
    // piedras y arbustos
    for(i=0;i<14;i++){var sx=rnd(i*4)*W,sy=7*c+c*.02;if(Math.abs(sx-7*c)<c*1.6)continue;x.fillStyle='rgba(30,70,50,.9)';x.beginPath();x.ellipse(sx,sy,c*(.18+rnd(i)*.2),c*(.12+rnd(i*2)*.08),0,Math.PI,0);x.fill()}
  }
  return o;
}
function dibujarAgua(n,c,t){
  var W=cv.width,H=cv.height;
  var izq=Math.min(n.apoyos[0].x,n.apoyos[1].x)*c,der=Math.max(n.apoyos[0].x,n.apoyos[1].x)*c,yb=n.apoyos[0].y;
  var ya=(yb+2)*c;
  ctx.save();ctx.beginPath();ctx.rect(izq,ya-c*.1,der-izq,H-ya+c*.1);ctx.clip();

  ctx.fillStyle=ga;ctx.fillRect(izq,ya-c*.1,der-izq,H-ya+c*.1);
  // reflejos de la luna y destellos
  for(var k=0;k<4;k++){
    ctx.strokeStyle='rgba(170,235,255,'+(0.55-k*0.1)+')';ctx.lineWidth=2.2;ctx.beginPath();
    for(var x=izq;x<=der;x+=5){var yy=ya+c*(.12+k*.2)+Math.sin(x/(26+k*8)+t*(1.4+k*.3)+k)*c*.045;if(x===izq)ctx.moveTo(x,yy);else ctx.lineTo(x,yy)}

  }

  for(k=0;k<14;k++){ctx.beginPath();ctx.ellipse(izq+3+Math.sin(t*2+k)*2,ya+c*.05+k*c*.1,c*.12,c*.05,0,0,6.283);ctx.fill();ctx.beginPath();ctx.ellipse(der-3+Math.sin(t*2+k)*2,ya+c*.05+k*c*.1,c*.12,c*.05,0,0,6.283);ctx.fill()}
  ctx.restore();
}

/* viga realista: madera con vetas y nudos, acero con brillo y remaches */
function jirones(x,w,L,lado){ // puntos del borde quebrado
  var p=[],n=7,i;for(i=0;i<=n;i++){p.push([L+(rnd(x+i*3)-.5)*w*.55*lado,-w/2+(w*i/n)])}return p;
}
function cuerpoViga(L,w,mat,idx,roto,lado){
  var g=ctx.createLinearGradient(0,-w/2,0,w/2);
  if(mat==='madera'){g.addColorStop(0,'#a86a30');g.addColorStop(.2,'#e6b27c');g.addColorStop(.5,'#d89a5c');g.addColorStop(.8,'#b9783a');g.addColorStop(1,'#7c4a1f')}
  else{g.addColorStop(0,'#5a7099');g.addColorStop(.18,'#e8f0ff');g.addColorStop(.45,'#aebfe3');g.addColorStop(.8,'#7e93bd');g.addColorStop(1,'#46587a')}
  ctx.fillStyle=g;ctx.beginPath();
  if(roto){var pts=jirones(idx*10,w,L,lado);ctx.moveTo(0,-w/2);ctx.lineTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.lineTo(0,w/2)}
  else{ctx.rect(0,-w/2,L,w)}
  ctx.closePath();ctx.fill();
  if(mat==='madera'){

function dibujar(now){
  var c=cs(),W=cv.width,H=cv.height,n=nv(),t=now/1000;

  };

  // tablero de carretera sobre las vigas horizontales a nivel del puente
  if(n.tipo==='puente'){

      if(p.y1===p.y2&&p.y1===n.apoyos[0].y){

  }
  ctx.globalAlpha=alfa;

    var a=desp(p.x1,p.y1),b=desp(p.x2,p.y2);
    var info=P&&!P.res.mecanismo?P.res.piezas[i]:null,tinte=null,razon=0,falla=false;
