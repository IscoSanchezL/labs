# Worker "labs-candado": exige la contraseña y sirve el sitio desde dist/ (sin depender de GitHub Pages).
# Secretos PASSWORD y COOKIE_SECRET: se guardan en Cloudflare (no aquí).
name = "labs-candado"
main = "cloudflare/worker.js"
compatibility_date = "2025-01-01"
routes = [{ pattern = "labs.iscosanchez.com/*", zone_name = "iscosanchez.com" }]

[build]
command = "node scripts/construir.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true      # el Worker decide primero (contraseña) y luego entrega el archivo
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

# Límite de intentos de contraseña: 10 por minuto por IP (lo aplica el Worker en POST /__login)
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60
