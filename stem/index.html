<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STEM Labs · Gi School</title>
<meta name="description" content="Laboratorio STEM para primaria: experimentos interactivos por grado y por categoría.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/lab.css">
<style>
.wrap.ancho{max-width:1180px}
.banner{position:relative;width:100%;max-width:1400px;margin:0 auto;aspect-ratio:1672/941;max-height:740px;overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 58%,transparent 100%);mask-image:linear-gradient(#000 58%,transparent 100%)}
.banner img{display:block;width:100%;height:100%;object-fit:cover;animation:respira 10s ease-in-out infinite alternate}
@keyframes respira{from{transform:scale(1);filter:brightness(1)}to{transform:scale(1.04);filter:brightness(1.1)}}
.zoom{position:absolute;inset:0;transform-origin:50% 36%;will-change:transform,opacity}
header.top{position:absolute;top:0;left:0;right:0;z-index:5;background:linear-gradient(rgba(7,15,28,.88),rgba(7,15,28,.35) 70%,transparent);text-shadow:0 1px 12px rgba(7,15,28,.95),0 0 3px rgba(7,15,28,.9)}
.hero{position:relative;z-index:2;margin-top:-8.5vw;padding:0 0 30px;text-align:center}
.hero::before{content:"";position:absolute;inset:-130px -6% -20px;z-index:-1;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(7,15,28,.9),rgba(7,15,28,.6) 55%,transparent 100%);pointer-events:none}
.hero .eyebrow{background:rgba(7,15,28,.72)}
.hero h1{margin:14px auto 0;max-width:900px;font-size:clamp(32px,5.6vw,60px);text-shadow:0 4px 40px rgba(7,15,28,.9)}
.hero .sub{margin:18px auto 0;max-width:680px}
.cur{display:inline-block;width:8px;height:15px;margin-left:6px;vertical-align:-2px;background:var(--accent);animation:parp 1s steps(2) infinite}
@keyframes parp{50%{opacity:0}}
.logo img{width:44px;height:44px;border-radius:12px}
@media (min-width:1401px){.banner{max-width:1500px;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 16%,#000 84%,transparent 100%),linear-gradient(#000 58%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,#000 16%,#000 84%,transparent 100%),linear-gradient(#000 58%,transparent 100%);mask-composite:intersect}}
@media (max-width:560px){.hero{margin-top:-16vw}.banner{aspect-ratio:4/3.4;max-height:none}.banner img{object-position:50% 35%}}
@media (prefers-reduced-motion:reduce){.banner img,.cur{animation:none}}
.centro{padding:22px;margin:6px 0 34px;border-radius:28px}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 18px}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.cats .tab{display:inline-flex;gap:7px;align-items:center}
.grado{margin:0 0 18px;padding:20px;border-radius:24px}
.grado>h2{display:flex;align-items:center;gap:14px;margin:0 0 4px;font-size:clamp(22px,3vw,30px);letter-spacing:0;text-transform:none;color:var(--text);font-weight:700}
.num{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;font-size:26px;font-weight:700;color:#06121f;background:linear-gradient(135deg,#9ff7ec,#9db8ff)}
.grado>h2 small{font-size:14px;color:var(--dim);font-weight:400}
.cuerpo{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px 16px;margin-top:18px}
.cat{margin:0}
.cat h3{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:18px}
.cat h3 i{font-style:normal;font-size:22px}
.cat h3 span{width:34px;height:4px;border-radius:4px;display:inline-block}
.exps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.exp{position:relative;display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid var(--edge);transition:transform .18s,border-color .18s,box-shadow .18s;min-height:170px}
a.exp:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 12px 30px -14px var(--c)}
.exp .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent)}
.exp b{font-size:17px;line-height:1.2}
.exp p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.exp .aprende{margin-top:auto;font-size:12.5px;color:var(--c)}
.exp .est{position:absolute;top:14px;right:14px;font-size:11.5px;letter-spacing:.05em;padding:3px 9px;border-radius:999px;border:1px solid var(--edge);color:var(--dim)}
.exp.listo .est{color:#06121f;background:var(--c);border-color:var(--c);font-weight:700}
.exp.pronto{opacity:.62}
.vacio{padding:30px;text-align:center;color:var(--dim)}
@media (prefers-reduced-motion:reduce){a.exp:hover{transform:none}}
.exp .mk{margin-top:8px;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,194,122,.6);background:rgba(255,194,122,.12);color:#ffd9a8;font-size:12.5px;cursor:pointer}
.exp .mk:hover{background:rgba(255,194,122,.24)}
dialog#guia{width:min(920px,94vw);max-height:92vh;padding:0;border:1px solid var(--edge);border-radius:22px;background:#0b1626;color:var(--text);box-shadow:0 30px 90px rgba(0,0,0,.7)}
dialog#guia::backdrop{background:rgba(3,8,16,.78);backdrop-filter:blur(4px)}
#guia .gh{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px 20px;background:#0b1626;border-bottom:1px solid var(--edge)}
#guia .gh b{font-size:18px}
#guia .gc{padding:6px 22px 24px;overflow:auto;max-height:calc(92vh - 62px)}
#guia h3{margin:22px 0 8px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
#guia .meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
#guia .meta span{padding:6px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);font-size:13.5px;color:var(--muted)}
#guia ul,#guia ol{margin:0;padding-left:22px;line-height:1.6;color:var(--muted)}
#guia table{width:100%;border-collapse:collapse;font-size:14px}
#guia th,#guia td{padding:8px 10px;border:1px solid var(--edge);text-align:left;vertical-align:top}
#guia th{background:rgba(255,255,255,.07);color:var(--text)}
#guia td{color:var(--muted)}
#guia .paso{margin:0 0 12px;padding:12px 14px;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.04)}
#guia .paso h4{margin:0 0 6px;font-size:15.5px;color:var(--text)}
#guia .paso h4 small{color:#ffd36b;font-weight:400;margin-left:8px}
#guia .ob{padding:12px 14px;border-radius:14px;background:rgba(79,209,197,.1);border:1px solid rgba(79,209,197,.4);color:var(--text);line-height:1.55}
@media print{body>*:not(dialog#guia){display:none!important}dialog#guia{position:static;width:100%;max-height:none;border:0;box-shadow:none;background:#fff;color:#000}#guia .gh button{display:none}#guia .gc{max-height:none;overflow:visible}#guia th{background:#eee;color:#000}#guia td,#guia ul,#guia ol,#guia .meta span{color:#222}#guia .ob,#guia .paso{background:#fff;color:#000;border-color:#999}#guia .paso h4{color:#000}#guia h3{color:#000}}

</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="piso" aria-hidden="true"></div>

<div class="banner"><div class="zoom" id="zoom"><img src="hero.jpg" alt="STEM: un portal de cristal que se abre hacia un mundo de ciencia" data-i18n-attr="alt:heroAlt" fetchpriority="high"></div></div>
<header class="top"><div class="wrap ancho">
  <div class="logo"><img src="logo.png" alt="" width="44" height="44"><div>STEM Labs<span> · Gi School</span></div></div>
  <div class="der"><div id="lang"></div></div>
</div></header>

<main class="wrap ancho">
  <section class="hero">
    <span class="eyebrow"><span data-i18n="eyebrow"></span><span class="cur"></span></span>
    <h1 data-i18n="h1"></h1>
    <p class="sub" data-i18n="sub"></p>
  </section>

  <section class="glass centro" aria-label="STEM Labs">
    <div class="filtros" id="grados" role="group" data-i18n-attr="aria-label:fGrado"></div>
    <div class="cats" id="cats" role="group" data-i18n-attr="aria-label:fCat"></div>
    <div id="lista"></div>
  </section>
</main>
<dialog id="guia" aria-label="Guía para el docente"></dialog>
<footer><div class="wrap"><div data-i18n="pie"></div><div>iscosanchez.com</div></div></footer>

<script src="../assets/i18n.js"></script>
<script src="datos.js"></script>
<script src="makerspace.js"></script>
<script>
var D = window.STEM, T = I18N.t, L = function () { return I18N.get(); };
I18N.add({
  titulo: 'STEM Labs · Gi School', descripcion: 'Laboratorio STEM para primaria: experimentos interactivos por grado y por categoría.',
  eyebrow: '// laboratorio STEM', h1: 'Experimenta, <em>descubre</em> y crea',
  sub: 'Elige tu grado y tu categoría. Cada tarjeta es un experimento interactivo que explica una idea de ciencia, tecnología, ingeniería o matemáticas.',
  heroAlt: 'STEM: un portal de cristal que se abre hacia un mundo de ciencia', fGrado: 'Elegir grado', fCat: 'Elegir categoría', todos: 'Todos', todas: 'Todas', grado: 'Grado', exps: 'experimentos', exp1: 'experimento',
  listo: 'LISTO', pronto: 'PRONTO', aprendes: 'Aprendes:', vacio: 'Todavía no hay experimentos aquí.', pie: 'Hecho para el aula · Gi School'
}, {
  titulo: 'STEM Labs · Gi School', descripcion: 'STEM lab for elementary school: interactive experiments by grade and by category.',
  eyebrow: '// STEM lab', h1: 'Experiment, <em>discover</em> and create',
  sub: 'Pick your grade and your category. Each card is an interactive experiment that explains an idea from science, technology, engineering or math.',
  heroAlt: 'STEM: a crystal portal opening onto a world of science', fGrado: 'Choose grade', fCat: 'Choose category', todos: 'All', todas: 'All', grado: 'Grade', exps: 'experiments', exp1: 'experiment',
  listo: 'READY', pronto: 'SOON', aprendes: 'You learn:', vacio: 'There are no experiments here yet.', pie: 'Made for the classroom · Gi School'
});
var fg = 'todos', fc = 'todas';
var $ = function (id) { return document.getElementById(id); };
function boton(txt, pr, fn) { var b = document.createElement('button'); b.type = 'button'; b.className = 'tab'; b.innerHTML = txt; b.setAttribute('aria-pressed', String(pr)); b.onclick = fn; return b; }
function pintar() {
  var g = $('grados'); g.textContent = '';
  g.appendChild(boton(T('todos'), fg === 'todos', function () { fg = 'todos'; pintar(); }));
  D.grados.forEach(function (n) { g.appendChild(boton(n + '°', fg === n, function () { fg = n; pintar(); })); });
  var c = $('cats'); c.textContent = '';
  c.appendChild(boton(T('todas'), fc === 'todas', function () { fc = 'todas'; pintar(); }));
  Object.keys(D.categorias).forEach(function (k) {
    var ct = D.categorias[k]; c.appendChild(boton(ct.icono + ' ' + ct[L()], fc === k, function () { fc = k; pintar(); }));
  });
  var cont = $('lista'); cont.textContent = ''; var hubo = false;
  D.grados.forEach(function (n) {
    if (fg !== 'todos' && fg !== n) return;
    var xs = D.experimentos.filter(function (e) { return e.grado === n && (fc === 'todas' || e.cat === fc); });
    if (!xs.length && fg === 'todos') return;
    hubo = true;
    var s = document.createElement('section'); s.className = 'glass grado';
    var h = document.createElement('h2');
    h.innerHTML = '<span class="num">' + n + '°</span><span>' + T('grado') + ' ' + n + '<br><small>' + xs.length + ' ' + (xs.length === 1 ? T('exp1') : T('exps')) + '</small></span>';
    s.appendChild(h);
    var cuerpo = document.createElement('div'); cuerpo.className = 'cuerpo'; s.appendChild(cuerpo);
    Object.keys(D.categorias).forEach(function (k) {
      var ys = xs.filter(function (e) { return e.cat === k; }); if (!ys.length) return;
      var ct = D.categorias[k], sec = document.createElement('div'); sec.className = 'cat';
      sec.innerHTML = '<h3><i>' + ct.icono + '</i>' + ct[L()] + '<span style="background:' + ct.color + '"></span></h3>';
      var gr = document.createElement('div'); gr.className = 'exps';
      ys.forEach(function (e) {
        var t = e[L()], listo = e.estado === 'listo';
        var a = document.createElement(listo ? 'a' : 'div'); a.className = 'exp ' + e.estado; a.style.setProperty('--c', ct.color);
        if (listo) a.href = e.url;
        a.innerHTML = '<span class="est">' + T(e.estado) + '</span><div class="ic">' + e.icono + '</div><b>' + t.n + '</b><p>' + t.d + '</p><div class="aprende">' + T('aprendes') + ' ' + t.a + '</div>';
        if (window.MAKER && MAKER[e.id]) { var mb = document.createElement('button'); mb.type = 'button'; mb.className = 'mk'; mb.textContent = '🛠️ Guía Makerspace (docente)'; mb.onclick = function (ev) { ev.preventDefault(); ev.stopPropagation(); guia(e); }; a.appendChild(mb); }
        gr.appendChild(a);
      });
      sec.appendChild(gr); cuerpo.appendChild(sec);
    });
    if (!xs.length) { var v = document.createElement('div'); v.className = 'vacio'; v.textContent = T('vacio'); cuerpo.appendChild(v); }
    cont.appendChild(s);
  });
  if (!hubo) { var v2 = document.createElement('div'); v2.className = 'vacio'; v2.textContent = T('vacio'); cont.appendChild(v2); }
}

function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function guia(e) {
  var m = MAKER[e.id], d = $('guia'), li = function (a) { return '<ul>' + a.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>'; };
  var h = '<div class="gh"><b>' + e.icono + ' ' + esc(e.es.n) + ' · Guía Makerspace (' + e.grado + '°)</b><span><button class="btn sec" type="button" onclick="window.print()">🖨️ Imprimir</button> <button class="btn" type="button" onclick="document.getElementById(\'guia\').close()">Cerrar</button></span></div><div class="gc">';
  h += '<div class="meta"><span>⏱ ' + esc(m.dur) + '</span><span>👥 ' + esc(m.equipo) + '</span><span>📍 ' + esc(m.espacio) + '</span></div>';
  h += '<h3>Objetivo de aprendizaje</h3><div class="ob">' + esc(m.obj) + '</div><h3>Conexión con el laboratorio digital</h3><p style="margin:0;color:var(--muted);line-height:1.55">' + esc(m.lab) + '</p>';
  h += '<h3>Materiales</h3><table><tr><th>Material</th><th>Cantidad</th><th>Nota</th></tr>' + m.mat.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('') + '</table>';
  if (m.herr && m.herr.length) h += '<h3>Herramientas</h3>' + li(m.herr);
  h += '<h3>Preparación del docente</h3><ol>' + m.prep.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol><h3>Seguridad</h3>' + li(m.seg);
  h += '<h3>Paso a paso (modelo 5E)</h3>' + m.pasos.map(function (p, i) { return '<div class="paso"><h4>' + (i + 1) + '. ' + esc(p.f) + ': ' + esc(p.t) + '<small>' + p.min + ' min</small></h4><ul>' + p.x.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>'; }).join('');
  h += '<h3>Preguntas para guiar la conversación</h3>' + li(m.preg);
  h += '<h3>Rúbrica (3 niveles)</h3><table><tr><th>Criterio</th><th>Inicia</th><th>Avanza</th><th>Logra</th></tr>' + m.rub.map(function (r) { return '<tr><td><b>' + esc(r[0]) + '</b></td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('') + '</table>';
  h += '<h3>Errores comunes</h3>' + li(m.err) + '<h3>Para ir más lejos</h3>' + li(m.ext) + '</div>';
  d.innerHTML = h; if (d.showModal) d.showModal(); else d.setAttribute('open', '');
}
I18N.onChange(pintar); pintar(); I18N.montar();
$('guia').addEventListener('click', function (ev) { if (ev.target === this) this.close(); });
/* Zoom al desplazarse: al bajar por la página el portal se acerca, como si entraras */
(function () {
  var z = document.getElementById('zoom'), b = document.querySelector('.banner');
  if (!z || !b || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  var pend = false;
  function act() { pend = false; var h = b.offsetHeight || 600, p = Math.min(Math.max((window.scrollY || 0) / (h * 0.95), 0), 1), e = p * p * (3 - 2 * p); z.style.transform = 'scale(' + (1 + 0.7 * e).toFixed(4) + ')'; z.style.opacity = (1 - 0.35 * e).toFixed(3); }
  window.addEventListener('scroll', function () { if (!pend) { pend = true; requestAnimationFrame(act); } }, { passive: true });
  window.addEventListener('resize', act); act();
})();
</script>
</body>
</html>
