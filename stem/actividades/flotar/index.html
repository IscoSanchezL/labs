<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flota o se hunde · STEM Labs</title>
<meta name="description" content="Descubre qué flota, qué se hunde y cómo hacer que una bolita de plastilina flote. Grado 1°.">
<link rel="icon" type="image/png" href="../../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/lab.css">
<style>
.zona{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:18px;align-items:start;padding-bottom:30px}
.escena{padding:14px}
.pasos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pasos .tab{display:inline-flex;gap:8px;align-items:center;font-size:15px;padding:9px 14px}
.pasos .tab b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.14);font-size:13px}
.pasos .tab.hecho b{background:var(--ok);color:#06121f}
.sala{min-height:380px;border-radius:18px;background:linear-gradient(180deg,#0e2038,#09111f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;text-align:center}
.organo{font-size:92px;line-height:1;animation:late 3s ease-in-out infinite}
.sala canvas{width:100%;max-width:640px;height:auto;border-radius:18px;background:#050b1c}
.rango{display:flex;align-items:center;gap:12px;font-size:20px;color:var(--muted)}.rango input{width:240px;height:34px;accent-color:#ffd95e}
@keyframes late{50%{transform:scale(1.08)}}
.pregunta{font-size:clamp(20px,3vw,28px);font-weight:700;max-width:560px}
.ops{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.op{min-width:112px;padding:14px 12px;border-radius:22px;border:3px solid var(--edge);background:var(--glass);font-size:56px;line-height:1;transition:transform .15s,border-color .15s}
.op small{display:block;margin-top:6px;font-size:15px;color:var(--muted);font-weight:500}
.op:hover{transform:translateY(-3px);border-color:rgba(127,240,228,.7)}
.op.bien{border-color:var(--ok);background:rgba(139,232,174,.18)}
.op.mal{border-color:var(--bad);animation:tiembla .35s}
@keyframes tiembla{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.msj{min-height:30px;font-size:20px;font-weight:700}
.escuchar{font-size:20px;padding:12px 22px}
.explica h2{font-size:22px;letter-spacing:0;text-transform:none;color:var(--text);margin:0 0 8px;font-weight:700}
.explica p{font-size:18px;line-height:1.5;color:var(--muted);margin:0 0 10px}
.explica p b{color:var(--text)}
.mision{margin-top:12px;padding:14px;border-radius:16px;border:2px dashed rgba(127,240,228,.5);font-size:17px;line-height:1.45}
.mision.ok{border-style:solid;border-color:var(--ok);background:rgba(139,232,174,.1)}
.mision .t{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--accent);margin-bottom:4px}
.dato{margin-top:12px;font-size:14.5px;color:var(--dim)}
.controles{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 4px 2px}
.voz{font-size:20px;padding:6px 12px}
.nav{display:flex;justify-content:space-between;margin-top:14px;gap:10px}
.fin{display:none;margin-top:12px;text-align:center;font-size:20px}.fin.v{display:block}
@media (max-width:900px){.zona{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.organo{animation:none}.op.mal{animation:none}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="piso" aria-hidden="true"></div>
<header class="top"><div class="wrap">
  <div class="logo"><img src="../../logo.png" alt="" width="40" height="40"><div>STEM Labs<span> · Gi School</span></div></div>
  <div class="der"><a class="volver" href="../../">← Todos los experimentos</a></div>
</div></header>
<main class="wrap">
  <section class="titulo">
    <span class="eyebrow">// grado 1° · materia</span>
    <h1>¿Flota o se <em>hunde</em>?</h1>
    <p class="sub">Deja caer cosas al agua y mira qué pasa. ¡Es un experimento!</p>
  </section>
  <section class="zona">
    <div class="glass escena">
      <div class="pasos" id="pasos" role="group" aria-label="Pasos"></div>
      <div class="sala" id="sala" aria-live="polite"></div>
    </div>
    <aside>
      <div class="glass panel explica">
        <h2 id="tit"></h2><p id="txt"></p>
        <div class="mision" id="mis"><div class="t">// TU MISIÓN</div><span id="misTxt"></span></div>
        <div class="dato" id="dato"></div>
        <div class="controles"><button class="btn sec voz" id="bVoz" type="button" aria-label="Escuchar" title="Escuchar">🔊</button><button class="tab" id="bAuto" type="button">🗣️ Voz automática</button></div>
        <div class="nav"><button class="btn sec" id="bAnt" type="button">← Atrás</button><button class="btn" id="bSig" type="button">Siguiente →</button></div>
        <div class="fin" id="fin">🎉 ¡Ya sabes qué flota y qué se hunde!</div>
      </div>
    </aside>
  </section>
</main>
<footer><div class="wrap"><div>Hecho para el aula · Gi School</div><div>iscosanchez.com</div></div></footer>
<script src="../../../assets/i18n.js"></script>
<script src="../../narrar.js"></script>
<script src="flotar.js"></script>
</body>
</html>
